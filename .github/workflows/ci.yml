name: CI

# #178 上线门:前端 PR 的最小测试门(tsc + jest + 生产构建)。
# deploy.yml(主千 rsync 部署)语义本票不动——部署前测试门是否强制,
# 待与 deploy 流水线一起拍板(见 issue #178 验收记录)。
on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: CI=true npx craco test --watchAll=false
      - name: Production build (user + admin)
        # CI=false:Actions 默认 CI=true,CRA 会把 ESLint 警告当错误。主干上还有一批
        # 历史遗留警告(jsx-a11y / 未用变量 / hook 依赖,集中在面试管理与反馈页,
        # 与本功能无关),不设 false 这个门一上来就是红的。
        # 真正该拦的(语法/类型)仍会失败:类型另有 tsc 一步。
        # #24 在清这批警告,但它已 stale 一个多月且与主干冲突;等它(或等价的清理)
        # 落地后,这里可以去掉 CI=false 恢复严格。
        run: CI=false npm run build
