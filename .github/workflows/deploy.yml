name: Deploy to Server

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      # 双构建：用户端(build-user) + 管理端(build-admin)，见 craco.config.js 的 @routes 别名
      # 放在构建前：类型错误在这里 10 秒内就报出来，
      # 不用等两轮 webpack 打包；也保证 tsconfig 被 tsc 真正读过一遍
      - name: Type check
        run: npm run typecheck

      - name: Build user site
        run: npm run build:user
        env:
          CI: false

      - name: Build admin site
        run: npm run build:admin
        env:
          CI: false

      - name: Deploy user site (official.boyuan.club)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "build-user/*"
          target: "/var/www/boyuan-web-frontend/"
          strip_components: 1
          rm: true

      - name: Deploy admin site (admin.boyuan.club)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "build-admin/*"
          target: "/var/www/boyuan-admin/"
          strip_components: 1
          rm: true
